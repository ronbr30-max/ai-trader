name: AI Trader Bot

on:
  schedule:
    - cron: '0 * * * *'    # Every hour (GitHub throttles more frequent runs)
  workflow_dispatch:         # Allow manual runs

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: users.db
          key: users-db-latest
          restore-keys: |
            users-db-

      - name: Run V2 trading bot (55 minutes)
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
        run: python bot_worker_v2.py "$BOT_EMAIL" --duration 3300

      - name: Save database
        uses: actions/cache/save@v4
        if: always()
        with:
          path: users.db
          key: users-db-latest
